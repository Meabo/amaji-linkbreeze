# Build the Amaji image here, not on the deploy host.
#
# Building Next.js on the small box that also runs Postiz and the Cloudflare tunnel
# starved it badly enough to take the whole host offline. GitHub Actions does the build,
# Coolify only ever pulls a finished image.
name: Build Amaji image

on:
  push:
    branches: [amaji]
  workflow_dispatch:

concurrency:
  group: amaji-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=amaji
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
